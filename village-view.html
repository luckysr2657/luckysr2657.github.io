<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khumanpur Village View</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5eb;
      color: #064f3b;
    }

    .page {
      max-width: 1200px;
      margin: auto;
      padding: 50px 30px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #52706a;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .photo-card {
      background: white;
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.10);
      text-align: center;
    }

    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      object-fit: contain;
    }

    .photo-card p {
      font-weight: bold;
      margin: 15px 5px 5px;
      font-size: 18px;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 35px auto 0;
      padding: 12px 25px;
      background: #064f3b;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="page">

    <h1>Village View</h1>

    <p class="subtitle">
      Beautiful views and photographs of Khumanpur village
    </p>

    <div class="photo-gallery">

      <div class="photo-card">
        <img src="village-view.jpeg" alt="Khumanpur Village View">
        <p>Khumanpur Village View</p>
      </div>

    </div>

    <a href="index.html" class="back">← Back to Khumanpur Photos</a>

  </div>

</body>
</html>

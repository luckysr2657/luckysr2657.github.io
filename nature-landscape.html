<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nature & Landscape - Khumanpur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5ed;
      color: #064e3b;
    }

    .top-bar {
      height: 6px;
      background: #064e3b;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 50px 25px 70px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin: 0 0 12px;
      color: #075c3f;
    }

    .subtitle {
      text-align: center;
      font-size: 20px;
      color: #52706a;
      margin-bottom: 45px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .photo-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.10);
    }

    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .caption {
      padding: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #075c3f;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 40px auto 0;
      padding: 12px 25px;
      background: #075c3f;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .back:hover {
      opacity: 0.9;
    }

    @media (max-width: 800px) {
      .gallery {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 550px) {
      .gallery {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar"></div>

  <div class="page">

    <h1>Nature & Landscape</h1>

    <p class="subtitle">
      Beautiful nature and landscapes of Khumanpur
    </p>

    <div class="gallery">

      <div class="photo-card">
        <img src="nature-landscape.jpeg" alt="Khumanpur Nature and Landscape">
        <div class="caption">Nature & Landscape</div>
      </div>

    </div>

    <a href="index.html" class="back">← Back to Khumanpur Photos</a>

  </div>

</body>
</html>
